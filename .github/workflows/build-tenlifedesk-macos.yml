name: Build TENlifeDesk (macOS Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-tenlifedesk-macos.yml'
      - 'build.py'
      - 'flutter/macos/**'
      - 'flutter/assets/**'

permissions:
  contents: write

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  APP_NAME: "TENlifeDesk"
  DEFAULT_RENDEZVOUS_SERVER: "tenlifeai.synology.me"
  DEFAULT_RS_PUB_KEY: "goYXY9yJETjV3TjXhmmzoLdU0biq3K7VVnwbfVtOqJc="

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos-arm64:
    name: TENlifeDesk macOS arm64
    needs: [generate-bridge]
    runs-on: macos-15
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Inject TENlifeDesk server config and app name
        shell: python3 {0}
        env:
          CFG_SERVER: ${{ secrets.RENDEZVOUS_SERVER || env.DEFAULT_RENDEZVOUS_SERVER }}
          CFG_KEY: ${{ secrets.RS_PUB_KEY || env.DEFAULT_RS_PUB_KEY }}
          CFG_APP_NAME: ${{ env.APP_NAME }}
        run: |
          import os, re
          path = "libs/hbb_common/src/config.rs"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          server = os.environ["CFG_SERVER"].strip()
          key = os.environ["CFG_KEY"].strip()
          app_name = os.environ["CFG_APP_NAME"].strip()

          text, n1 = re.subn(
              r'pub static ref PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new\(""\.to_owned\(\)\);',
              f'pub static ref PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new("{server}".to_owned());',
              text,
          )
          text, n2 = re.subn(
              r'pub static ref APP_NAME: RwLock<String> = RwLock::new\("RustDesk"\.to_owned\(\)\);',
              f'pub static ref APP_NAME: RwLock<String> = RwLock::new("{app_name}".to_owned());',
              text,
          )
          text, n3 = re.subn(
              r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]+\];',
              f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];',
              text,
          )
          text, n4 = re.subn(
              r'pub const RS_PUB_KEY: &str = "[^"]+";',
              f'pub const RS_PUB_KEY: &str = "{key}";',
              text,
          )
          print(f"Patched config.rs: PROD_RENDEZVOUS_SERVER={n1}, APP_NAME={n2}, RENDEZVOUS_SERVERS={n3}, RS_PUB_KEY={n4}")
          assert all(n == 1 for n in (n1, n2, n3, n4)), "Failed to patch one or more fields in config.rs"
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

      - name: Install build runtime
        run: |
          brew install llvm create-dmg gnu-sed
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Install NASM 2.16
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Keep CocoaPods and apply Flutter 3.44 patches
        run: |
          flutter config --no-enable-swift-package-manager
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-15

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              cat "$_1"
            done
            exit 1
          fi

      - name: Build TENlifeDesk macOS
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i '' -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i '' -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Create DMG package
        run: |
          APP_PATH=$(ls -d ./flutter/build/macos/Build/Products/Release/*.app | head -n 1)
          APP_NAME_BUNDLE=$(basename "$APP_PATH")
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i '' -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg \
            --volname "TENlifeDesk" \
            --icon "$APP_NAME_BUNDLE" 200 190 \
            --hide-extension "$APP_NAME_BUNDLE" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            TENlifeDesk-${{ env.VERSION }}-macos-arm64.dmg \
            "$APP_PATH"

      - name: Upload TENlifeDesk macOS DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TENlifeDesk-${{ env.VERSION }}-macos-arm64
          path: TENlifeDesk-${{ env.VERSION }}-macos-arm64.dmg

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: v${{ env.VERSION }}-tenlife
          name: TENlifeDesk v${{ env.VERSION }}
          files: |
            TENlifeDesk-${{ env.VERSION }}-macos-arm64.dmg
